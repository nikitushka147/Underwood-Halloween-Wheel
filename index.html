<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underwood Halloween Wheel 🎃👻</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #05020a;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(239, 68, 68, 0.35) 0%, transparent 55%),
                radial-gradient(circle at 20% 80%, rgba(34, 197, 94, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.25) 0%, transparent 50%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '😈';
            position: absolute;
            top: 20px;
            font-size: 4.5rem;
            opacity: 0.15;
            filter: drop-shadow(0 0 20px #ef4444);
            pointer-events: none;
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.15; }
            100% { transform: scale(1.15); opacity: 0.3; }
        }

        h1 {
            margin-bottom: 4px;
            color: #ef4444;
            text-align: center;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.8), 0 0 30px rgba(34, 197, 94, 0.6);
        }

        p.subtitle {
            margin-bottom: 12px;
            color: #4ade80;
            text-align: center;
            font-size: 0.95rem;
            text-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
            font-weight: 600;
        }

        /* Лічильник спроб */
        .attempts-badge {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        /* 📐 ЗБІЛЬШЕНО РОЗМІР КОЛЕСА (з 360px до 430px) */
        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            aspect-ratio: 1 / 1;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0 0 10px #ef4444);
        }

        .pointer::after {
            content: '👁️';
            position: absolute;
            top: -46px;
            left: -16px;
            font-size: 1.7rem;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.5), 0 0 20px rgba(34, 197, 94, 0.4), inset 0 0 20px rgba(0,0,0,0.9);
            transition: transform 4.5s cubic-bezier(0.15, 0.9, 0.1, 1);
        }

        .center-cap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55px;
            height: 55px;
            background: #090312;
            border: 3px solid #22c55e;
            border-radius: 50%;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.8);
        }

        .spin-btn {
            background: linear-gradient(135deg, #ef4444, #22c55e);
            color: #fff;
            font-size: 1.2rem;
            font-weight: 900;
            padding: 14px 35px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            transition: all 0.2s ease;
            width: 100%;
            max-width: 320px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spin-btn:hover:not(:disabled) {
            transform: scale(1.04);
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.8);
        }

        .spin-btn:disabled {
            background: #271428;
            color: #6b586e;
            cursor: not-allowed;
            box-shadow: none;
            transform: scale(1);
        }

        /* Модальне вікно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 1, 8, 0.9);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #0f051a;
            border: 2px solid #22c55e;
            color: #fff;
            padding: 25px 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.4), 0 0 15px rgba(239, 68, 68, 0.3);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-card h2 {
            color: #ef4444;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        }

        .modal-card p {
            color: #e2e8f0;
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .promo-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .promo-code-box {
            background: #180928;
            border: 2px dashed #22c55e;
            padding: 12px;
            border-radius: 12px;
            font-size: 1.6rem;
            font-weight: 900;
            color: #4ade80;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.6);
        }

        .copy-btn {
            background: #22c55e;
            color: #05020a;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .copy-btn:hover {
            background: #4ade80;
            transform: scale(1.02);
        }

        .copy-btn.copied {
            background: #3b82f6;
            color: #ffffff;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05rem;
            padding: 12px 15px;
            border-radius: 25px;
            border: none;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            transition: background 0.2s, transform 0.2s;
            cursor: pointer;
        }

        .modal-btn:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <h1>Terror Fortune 🎃🩸</h1>
    <p class="subtitle">Крути зловісне колесо та вигравай знижки!</p>

    <div class="attempts-badge" id="attemptsBadge">Залишилось спроб: 3 / 3 🔮</div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="800" height="800"></canvas>
        <div class="center-cap">💀</div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spinWheel()">КРУТИТИ КОЛЕСО ⚡</button>

    <!-- ВСПЛИВАЮЧЕ ВІКНО -->
    <div class="modal-overlay" id="modal">
        <div class="modal-card">
            <h2 id="modalTitle">Зловісне колесо! 👻</h2>
            <p id="modalText">Текст результату...</p>
            
            <div class="promo-container" id="promoContainer">
                <div id="promoBox" class="promo-code-box">SPOOKY5</div>
                <button class="copy-btn" id="copyBtn" onclick="copyPromoCode()">
                    <span>📋 Скопіювати промокод</span>
                </button>
            </div>
            
            <div class="modal-actions">
                <button class="modal-btn" id="modalMainBtn" onclick="closeModal()">Продовжити 🔮</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const promoContainer = document.getElementById('promoContainer');
        const promoBox = document.getElementById('promoBox');
        const copyBtn = document.getElementById('copyBtn');
        const modalMainBtn = document.getElementById('modalMainBtn');
        const attemptsBadge = document.getElementById('attemptsBadge');

        const sectors = [
            { id: 'lose1', label: "Спробуй ще! 🧙‍♀️", color: "#180928", textColor: "#4ade80" },
            { id: 'discount5', label: "Знижка 5% 🎃", color: "#ef4444", textColor: "#ffffff" },
            { id: 'lose2', label: "Привид вкрав! 👻", color: "#052e16", textColor: "#22c55e" },
            { id: 'discount7', label: "Знижка 7% 👁️", color: "#a855f7", textColor: "#ffffff" },
            { id: 'lose3', label: "Зілля Невдачі 🧪", color: "#180928", textColor: "#fca5a5" },
            { id: 'discount10', label: "Знижка 10% 🏆", color: "#22c55e", textColor: "#022c22" },
            { id: 'lose4', label: "Жахливий монстр 👹", color: "#7f1d1d", textColor: "#fca5a5" },
            { id: 'lose5', label: "Промах! 🧹", color: "#0f051a", textColor: "#4ade80" }
        ];

        const numSectors = sectors.length;
        const arc = (2 * Math.PI) / numSectors;
        let totalRotation = 0;

        // =========================================================================
        // 🧪 ТЕСТУВАННЯ: ВИЗНАЧНИК КІЛЬКОСТІ СПРОБ ТА ЗБЕРЕЖЕННЯ В ПАМ'ЯТІ
        // =========================================================================
        // Щоб повністю скинути лічильник під час тесту, можна тимчасово розкоментувати цей рядок:
        // localStorage.removeItem('hw_wheel_attempts'); localStorage.removeItem('hw_wheel_win');

        let currentAttempt = parseInt(localStorage.getItem('hw_wheel_attempts') || '0');
        let savedWin = localStorage.getItem('hw_wheel_win');

        function updateAttemptsUI() {
            const left = Math.max(0, 3 - currentAttempt);
            attemptsBadge.innerText = `Залишилось спроб: ${left} / 3 🔮`;

            // 🧪 ТЕСТУВАННЯ: Закоментуйте умову нижче, щоб кнопка НЕ блокувалась після 3 спроб
            if (currentAttempt >= 3) {
                spinBtn.disabled = true;
                spinBtn.innerText = "Спроби вичерпано 🔒";
            }
        }

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 15;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSectors; i++) {
                const angle = i * arc;
                
                ctx.beginPath();
                ctx.fillStyle = sectors[i].color;
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arc);
                ctx.lineTo(centerX, centerY);
                ctx.fill();
                ctx.strokeStyle = '#05020a';
                ctx.lineWidth = 6;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2);
                
                ctx.textAlign = "center";
                ctx.fillStyle = sectors[i].textColor;
                ctx.font = "900 22px 'Segoe UI', sans-serif";
                
                ctx.fillText(sectors[i].label, radius * 0.62, 8);
                ctx.restore();
            }
        }

        drawWheel();
        updateAttemptsUI();

        // 🧪 ТЕСТУВАННЯ: Якщо ви виграли раніше, тут показується модальне вікно перемоги.
        if (currentAttempt >= 3 && savedWin) {
            setTimeout(() => {
                const winData = JSON.parse(savedWin);
                showWinModal(winData.discount, winData.code);
            }, 500);
        }

        function spinWheel() {
            // 🧪 ТЕСТУВАННЯ: Закоментуйте перевірку нижче, щоб крутити безліч разів
            if (currentAttempt >= 3) return;

            spinBtn.disabled = true;

            // =========================================================================
            // 🧪 ТЕСТУВАННЯ: ІНКРЕМЕНТ ТА ЗБЕРЕЖЕННЯ СПРОБ
            // Закоментуйте ці 2 рядки, щоб спроби НЕ витрачалися та НЕ зберігалися:
            //currentAttempt++;
           // localStorage.setItem('hw_wheel_attempts', currentAttempt);
            // =========================================================================

            updateAttemptsUI();

            let targetSectorIndex;

            // 🧪 ТЕСТУВАННЯ: Логіка випадіння (перші 2 спроби — програш, 3-тя — виграш)
            if (currentAttempt < 3) {
                const loseIndices = [0, 2, 4, 6, 7];
                targetSectorIndex = loseIndices[Math.floor(Math.random() * loseIndices.length)];
            } else {
                const rand = Math.random() * 100;
                if (rand < 50) {
                    targetSectorIndex = 1; // 5%
                } else if (rand < 80) {
                    targetSectorIndex = 3; // 7%
                } else {
                    targetSectorIndex = 5; // 10%
                }
            }

            const fullSpins = 5;
            const sectorAngle = arc;
            const targetSectorCenter = targetSectorIndex * sectorAngle + sectorAngle / 2;
            const targetAngle = (3 * Math.PI / 2) - targetSectorCenter;

            const currentMod = totalRotation % (2 * Math.PI);
            let distanceToTarget = targetAngle - currentMod;
            if (distanceToTarget < 0) {
                distanceToTarget += 2 * Math.PI;
            }

            const rotationStep = (2 * Math.PI * fullSpins) + distanceToTarget;
            totalRotation += rotationStep;

            canvas.style.transform = `rotate(${totalRotation}rad)`;

            setTimeout(() => {
                handleSpinResult(sectors[targetSectorIndex]);
            }, 4600);
        }

        function handleSpinResult(sector) {
            if (currentAttempt < 3) {
                modalTitle.innerText = "Не цього разу! 👻";
                modalText.innerHTML = `Вам випало: <strong>${sector.label}</strong>.<br>Не замучуйся, у тебе є ще спроба!`;
                promoContainer.style.display = 'none';
                modalMainBtn.innerText = "Спробувати ще 🔄";
                modalMainBtn.onclick = closeModal;
                modal.classList.add('active');
            } else {
                let discount = "5%";
                let promoCode = "SPOOKY5";

                if (sector.id === 'discount7') {
                    discount = "7%";
                    promoCode = "SPOOKY7";
                } else if (sector.id === 'discount10') {
                    discount = "10%";
                    promoCode = "SPOOKY10";
                }

                localStorage.setItem('hw_wheel_win', JSON.stringify({ discount, code: promoCode }));
                showWinModal(discount, promoCode);
            }
        }

        function showWinModal(discount, promoCode) {
            modalTitle.innerText = "Вітаємо! 🎃🏆";
            modalText.innerHTML = `Темні сили прихильні до тебе!<br>Твій виграш: <strong>Знижка ${discount}</strong> на набір пива або лимонадів!`;
            promoBox.innerText = promoCode;
            promoContainer.style.display = 'flex';
            
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '<span>📋 Скопіювати промокод</span>';

            modalMainBtn.innerText = "Застосувати в Магазині 🍻";
            modalMainBtn.onclick = () => {
                window.open("https://underwood.beer/", "_blank");
            };
            modal.classList.add('active');
        }

        function copyPromoCode() {
            const codeText = promoBox.innerText;
            navigator.clipboard.writeText(codeText).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.innerHTML = '<span>✅ Скопійовано!</span>';
            });
        }

        function closeModal() {
            modal.classList.remove('active');
            if (currentAttempt < 3) {
                spinBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
